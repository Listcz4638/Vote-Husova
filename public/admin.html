<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Výsledky hlasování – Husova</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="icon" href="/husovalogo.png" type="image/png">
  <style>
    /* jen drobný vzhled navíc – můžeš klidně smazat */
    .wrap { max-width: 1100px; margin: 0 auto; padding: 20px; }
    .top { display:flex; gap:12px; flex-wrap:wrap; align-items:center; justify-content:space-between; }
    .badge { padding: 8px 12px; border-radius: 999px; background:#f2f2f2; font-weight:600; }
    .cards { display:grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 16px; }
    @media (max-width: 900px) { .cards { grid-template-columns: 1fr; } }
    .card { background:#fff; border-radius: 12px; padding: 16px; box-shadow: 0 2px 12px rgba(0,0,0,.06); }
    .card h2 { margin: 0 0 10px 0; }
    table { width:100%; border-collapse: collapse; }
    th, td { padding: 10px; border-bottom: 1px solid #eee; text-align:left; }
    th:last-child, td:last-child { text-align:right; }
    .winner { font-weight: 800; }
    .muted { opacity: .75; }
    button { cursor:pointer; }
    /* --- okno "Přidat změnu" --- */
    #addUpdateModal .modal-content { max-width: 460px; text-align: left; }
    #addUpdateModal h2 { margin: 0 0 14px; text-align: center; }
    #addUpdateModal label.fld { display:block; font-weight:700; margin: 12px 0 6px; }
    #addUpdateModal input[type="date"],
    #addUpdateModal textarea {
      width:100%; padding:10px 12px; border:1.5px solid #cfdccf; border-radius:10px;
      font: inherit; box-sizing:border-box;
    }
    #addUpdateModal textarea { min-height: 110px; resize: vertical; }
    .area-choice { display:flex; gap:10px; }
    .area-choice label {
      flex:1; text-align:center; padding:10px; border:2px solid #cfdccf; border-radius:10px;
      font-weight:700; cursor:pointer;
    }
    .area-choice input { display:none; }
    .area-choice label:has(input:checked) { border-color:#2b8a3e; background:#e8f5ea; color:#1b5e20; }
    #updCancel { background:#dfe6e0; color:#203323; }
    #updCancel:hover { background:#c9d3cb; }
    .char-count { font-size:.8rem; opacity:.7; text-align:right; margin-top:4px; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="top">
      <h1 style="margin:0;">📊 Výsledky hlasování</h1>
      <div class="badge">Celkem hlasů: <span id="totalVotes">0</span></div>
    </div>

    <p class="muted" style="margin-top:8px;">
      Tip: když změníš admin klíč, smaž uložený klíč v prohlížeči (LocalStorage) nebo klikni na “Změnit klíč”.
    </p>

    <div style="display:flex; gap:10px; margin: 12px 0; align-items:center; flex-wrap:wrap;">
      <button id="reloadBtn">🔄 Načíst znovu</button>
      <button id="changeKeyBtn">🔑 Změnit klíč</button>
      <button id="toggleVotingBtn" style="border:none; border-radius:8px; padding:10px 16px; font-weight:700; color:#fff;">⏳ Načítám stav…</button>
      <button id="addUpdateBtn" type="button" style="background:#1b5e20; color:#fff; border:none; border-radius:8px; padding:10px 16px; font-weight:700;">➕ Přidat změnu do tabulky</button>
      <button id="maintBtn" type="button" style="color:#fff; border:none; border-radius:8px; padding:10px 16px; font-weight:700; background:#999;">🛠 Údržba</button>
    </div>

    <div class="cards">
      <div class="card">
        <h2>1. stupeň</h2>
        <p id="winner1" class="winner"></p>
        <table>
          <thead>
            <tr><th>Soutěžící</th><th>Hlasy</th></tr>
          </thead>
          <tbody id="body1"></tbody>
        </table>
      </div>

      <div class="card">
        <h2>2. stupeň</h2>
        <p id="winner2" class="winner"></p>
        <table>
          <thead>
            <tr><th>Soutěžící</th><th>Hlasy</th></tr>
          </thead>
          <tbody id="body2"></tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- Okno: přidat změnu do tabulky Novinky a změny -->
  <div id="addUpdateModal" class="modal hidden">
    <div class="modal-content">
      <h2>➕ Přidat změnu</h2>

      <label class="fld" for="updDate">Datum změny</label>
      <input type="date" id="updDate">

      <label class="fld">Oblast</label>
      <div class="area-choice">
        <label><input type="radio" name="updArea" value="web" checked> 🌐 Web</label>
        <label><input type="radio" name="updArea" value="soutez"> 🎤 Soutěž</label>
      </div>

      <label class="fld" for="updText">Co se změnilo</label>
      <textarea id="updText" maxlength="500" placeholder="Např. Prodloužili jsme hlasování do pátku."></textarea>
      <div class="char-count"><span id="updCount">0</span>/500</div>

      <div class="modal-buttons">
        <button id="updSave" type="button">✅ Přidat</button>
        <button id="updCancel" type="button">❌ Zrušit</button>
      </div>
    </div>
  </div>

<script>
function pickWinner(resultsObj) {
  const entries = Object.entries(resultsObj || {});
  if (!entries.length) return null;
  entries.sort((a,b) => b[1] - a[1]);
  const [name, count] = entries[0];
  return { name, count, entries };
}

function renderTable(tbodyEl, entries) {
  tbodyEl.innerHTML = "";
  if (!entries.length) {
    tbodyEl.innerHTML = `<tr><td colspan="2" style="text-align:center; opacity:.7;">Zatím žádní soutěžící</td></tr>`;
    return;
  }
  for (const [name, count] of entries) {
    const tr = document.createElement("tr");
    tr.innerHTML = `<td>${name}</td><td>${count}</td>`;
    tbodyEl.appendChild(tr);
  }
}

async function loadResults(forceAskKey = false) {
  let key = localStorage.getItem("adminKey");

  if (forceAskKey || !key) {
    key = prompt("Zadej admin klíč:");
    if (!key) return;
    localStorage.setItem("adminKey", key);
  }

  const res = await fetch("/api/results?key=" + encodeURIComponent(key));
  if (!res.ok) {
    alert("❌ Špatný admin klíč nebo chyba serveru (" + res.status + ")");
    return;
  }

  const data = await res.json();
  document.getElementById("totalVotes").textContent = data.total ?? 0;

  // NOTE: předpokládám, že /api/results vrací i "votingOpen" (true/false).
  // Pokud tvůj backend posílá jiný název pole, uprav řádek níž.
  if (typeof data.votingOpen === "boolean") {
    votingOpen = data.votingOpen;
    paintToggleBtn();
  }

  if (typeof data.maintenance === "boolean") {
    maintenanceOn = data.maintenance;
    paintMaintBtn();
  }

  const results = data.results || {};
  const r1 = results["1"] || {};
  const r2 = results["2"] || {};

  const w1 = pickWinner(r1);
  const w2 = pickWinner(r2);

  document.getElementById("winner1").textContent =
    w1 ? `🏆 Vede: ${w1.name} (${w1.count})` : "Zatím žádné hlasy";

  document.getElementById("winner2").textContent =
    w2 ? `🏆 Vede: ${w2.name} (${w2.count})` : "Zatím žádné hlasy";

  renderTable(document.getElementById("body1"), w1 ? w1.entries : []);
  renderTable(document.getElementById("body2"), w2 ? w2.entries : []);
}

function getKey(forceAskKey = false) {
  let key = localStorage.getItem("adminKey");
  if (forceAskKey || !key) {
    key = prompt("Zadej admin klíč:");
    if (!key) return null;
    localStorage.setItem("adminKey", key);
  }
  return key;
}

let votingOpen = null; // true = otevřené, false = zavřené, null = zatím nevíme

function paintToggleBtn() {
  const btn = document.getElementById("toggleVotingBtn");
  if (votingOpen === null) {
    btn.textContent = "⏳ Načítám stav…";
    btn.style.background = "#999";
    btn.disabled = true;
    return;
  }
  btn.disabled = false;
  if (votingOpen) {
    btn.textContent = "🔴 Zavřít hlasování";
    btn.style.background = "#e53935";
  } else {
    btn.textContent = "🟢 Otevřít hlasování";
    btn.style.background = "#2b8a3e";
  }
}

async function toggleVoting() {
  const key = getKey();
  if (!key) return;

  const btn = document.getElementById("toggleVotingBtn");
  btn.disabled = true;
  const wantOpen = !votingOpen;

  btn.textContent = wantOpen ? "⏳ Otevírám…" : "⏳ Zavírám…";

  try {
    const res = await fetch("/api/voting-status?key=" + encodeURIComponent(key), {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ open: wantOpen }),
    });

    if (!res.ok) {
      alert("❌ Nepodařilo se změnit stav hlasování (" + res.status + ")");
      paintToggleBtn();
      return;
    }

    votingOpen = wantOpen;
    paintToggleBtn();
    await loadResults(false);
  } catch (err) {
    alert("❌ Chyba při komunikaci se serverem: " + err.message);
    paintToggleBtn();
  }
}

document.getElementById("reloadBtn").addEventListener("click", () => loadResults(false));
document.getElementById("changeKeyBtn").addEventListener("click", () => {
  localStorage.removeItem("adminKey");
  loadResults(true);
});
document.getElementById("toggleVotingBtn").addEventListener("click", toggleVoting);
// ===== Přidat změnu do tabulky =====
function todayIso() {
  const d = new Date();
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
}

function openAddModal() {
  document.getElementById("updDate").value = todayIso();
  document.querySelector('input[name="updArea"][value="web"]').checked = true;
  document.getElementById("updText").value = "";
  document.getElementById("updCount").textContent = "0";
  document.getElementById("addUpdateModal").classList.remove("hidden");
  document.getElementById("updText").focus();
}

function closeAddModal() {
  document.getElementById("addUpdateModal").classList.add("hidden");
}

async function saveUpdate() {
  const date = document.getElementById("updDate").value;
  const area = document.querySelector('input[name="updArea"]:checked').value;
  const text = document.getElementById("updText").value.trim();

  if (!date) { alert("Vyber datum změny."); return; }
  if (!text) { alert("Napiš, co se změnilo."); return; }

  const key = getKey();
  if (!key) return;

  const saveBtn = document.getElementById("updSave");
  saveBtn.disabled = true;
  saveBtn.textContent = "⏳ Ukládám…";

  try {
    const res = await fetch("/api/updates", {
      method: "POST",
      headers: { "Content-Type": "application/json", "x-admin-key": key },
      body: JSON.stringify({ date, area, text }),
    });

    if (res.status === 403) {
      alert("❌ Špatný admin klíč. Klikni na „Změnit klíč“ a zadej ho znovu.");
      return;
    }
    if (!res.ok) {
      const out = await res.json().catch(() => ({}));
      alert("❌ Nepodařilo se přidat změnu: " + (out.error || res.status));
      return;
    }

    closeAddModal();
    alert("✅ Změna byla přidána do tabulky na hlavní stránce.");
  } catch (err) {
    alert("❌ Chyba při komunikaci se serverem: " + err.message);
  } finally {
    saveBtn.disabled = false;
    saveBtn.textContent = "✅ Přidat";
  }
}

document.getElementById("addUpdateBtn").addEventListener("click", openAddModal);
document.getElementById("updSave").addEventListener("click", saveUpdate);
document.getElementById("updCancel").addEventListener("click", closeAddModal);
document.getElementById("updText").addEventListener("input", (e) => {
  document.getElementById("updCount").textContent = e.target.value.length;
});


// ===== Údržba =====
let maintenanceOn = null; // true = zapnutá, false = vypnutá, null = zatím nevíme

function paintMaintBtn() {
  const btn = document.getElementById("maintBtn");
  if (maintenanceOn === null) {
    btn.textContent = "🛠 Údržba";
    btn.style.background = "#999";
  } else if (maintenanceOn) {
    btn.textContent = "🛠 Údržba ZAPNUTÁ – vypnout";
    btn.style.background = "#e53935";
  } else {
    btn.textContent = "🛠 Zapnout údržbu";
    btn.style.background = "#e08a00";
  }
}

async function toggleMaintenance() {
  const key = getKey();
  if (!key) return;

  const want = !maintenanceOn;
  if (want && !confirm("Zapnout údržbu?\n\nNávštěvníci neuvidí přihlášení ani hlasování, jen zprávu, že web je v údržbě.")) {
    return;
  }

  const btn = document.getElementById("maintBtn");
  btn.disabled = true;
  btn.textContent = want ? "⏳ Zapínám…" : "⏳ Vypínám…";

  try {
    const res = await fetch("/api/maintenance", {
      method: "POST",
      headers: { "Content-Type": "application/json", "x-admin-key": key },
      body: JSON.stringify({ on: want }),
    });

    if (res.status === 403) {
      alert("❌ Špatný admin klíč. Klikni na „Změnit klíč“ a zadej ho znovu.");
    } else if (!res.ok) {
      const out = await res.json().catch(() => ({}));
      alert("❌ Nepodařilo se změnit údržbu: " + (out.error || res.status));
    } else {
      maintenanceOn = want;
    }
  } catch (err) {
    alert("❌ Chyba při komunikaci se serverem: " + err.message);
  } finally {
    btn.disabled = false;
    paintMaintBtn();
  }
}

document.getElementById("maintBtn").addEventListener("click", toggleMaintenance);

window.addEventListener("DOMContentLoaded", () => {
  paintToggleBtn();
  loadResults(false);
});
</script>
</body>
</html>
