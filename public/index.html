<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hlasování – ZŠ Husova</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="icon" href="/husovalogo.png" type="image/png">
</head>

<header class="top-bar">

  <!-- LEVÁ STRANA -->
  <div class="left">
    <a href="https://docs.google.com/document/d/1u2llPnj_Sbq6DMWa1-UAtV4anodlZOBb"
       target="_blank"
       class="plan-btn">
       📑 Oficiální plán soutěže
    </a>
  </div>

  <!-- STŘED -->
  <div class="center">
    <img src="logo.png" alt="Logo školy" class="logo">
    <h1>Hlasování – Hlas Husovky!</h1>
  </div>

  <!-- PRAVÁ STRANA -->
  <div class="right">

    <a href="https://docs.google.com/document/d/1grEA0BiG7xz4OMHbDqyrYJcJrZUcOZwr3e7_IB4OM68/edit?usp=sharing"
       target="_blank"
       class="how-btn">
       📖 Jak hlasovat
    </a>

    <a href="https://youtube.com/@HlasHusovky"
       target="_blank"
       class="youtube-btn">
       ▶ YouTube kanál
    </a>

    <button id="logoutBtn" class="logout-btn hidden" type="button">
      ⎋ Odhlásit
    </button>

  </div>

</header>

  <main>
    <!-- LOGIN -->
    <section class="login-section" id="loginSection">
      <span id="votingStatusBadge" class="live-badge">
        <span class="pulse-dot"></span>
        <span id="votingStatusText">Zjišťuji stav…</span>
      </span>
      <h2>Přihlášení</h2>
      <p>Pro hlasování se přihlaste se přes email.</p>
      <button id="loginBtn" type="button">Přihlaste se přes email</button>
    </section>

    <!-- VOTING -->
    <section class="vote-section hidden" id="voteSection">
      <h2>Vyber svého favorita 🎤</h2>
      <p id="classInfo"></p>

      <!-- 🔥 Toto bude vždy NAD tlačítky kategorií -->
      <p id="categoryHint" class="category-hint">
        Vyber kategorii:
      </p>

      <div class="category-row">
        <button class="catBtn" data-cat="1" type="button">1. stupeň</button>
        <button class="catBtn" data-cat="2" type="button">2. stupeň</button>
      </div>

      <div class="vote-grid" id="voteGrid"></div>
    </section>

    <!-- VÍTĚZOVÉ 2026 -->
    <section class="winners" aria-labelledby="winners-title">
      <h2 id="winners-title">🏆 Výherci pěveckého ročníku 2026</h2>

      <div class="winners-grid">
        <article class="winner-card">
          <div class="video-frame">
            <iframe
              src="https://www.youtube-nocookie.com/embed/NyZihcd-Yj0"
              title="Vítězka 1. stupně 2026"
              loading="lazy"
              allow="accelerometer; encrypted-media; gyroscope; picture-in-picture"
              allowfullscreen></iframe>
          </div>
          <h3>Výherkyně 1. stupně</h3>
        </article>

        <article class="winner-card">
          <div class="video-frame">
            <iframe
              src="https://www.youtube-nocookie.com/embed/xcDOwpogRT4"
              title="Vítěz 2. stupně 2026"
              loading="lazy"
              allow="accelerometer; encrypted-media; gyroscope; picture-in-picture"
              allowfullscreen></iframe>
          </div>
          <h3>Výherce 2. stupně</h3>
        </article>
      </div>
    </section>

    <style>
      .winners {
        width: 100%;
        max-width: 980px;
        margin: 48px auto;
        box-sizing: border-box;
        padding: 0 20px;
      }

      .winners h2 {
        text-align: center;
        color: #1f4a1f;
        font-size: 1.9rem;
        margin: 0 0 24px;
      }

      .winners-grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 24px;
      }

      .winner-card {
        position: relative;
        background: #fff;
        border-radius: 24px;
        padding: 20px 20px 22px;
        box-shadow: 0 10px 30px rgba(31, 74, 31, 0.12);
      }

      /* zelenožlutý proužek nahoře – stejný jako na přihlašovací kartě */
      .winner-card::before {
        content: "";
        position: absolute;
        top: -8px;
        left: 50%;
        transform: translateX(-50%);
        width: 64px;
        height: 5px;
        border-radius: 3px;
        background: linear-gradient(90deg, #6cbf4d, #e3c34a);
      }

      .video-frame {
        position: relative;
        aspect-ratio: 16 / 9;
        border-radius: 14px;
        overflow: hidden;
        background: #14301a;
      }

      .video-frame iframe {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        border: 0;
      }

      .winner-card h3 {
        margin: 16px 0 0;
        text-align: center;
        color: #1f4a1f;
        font-size: 1.15rem;
      }

      /* mobil: videa pod sebou */
      @media (max-width: 720px) {
        .winners-grid {
          grid-template-columns: 1fr;
        }
        .winners h2 {
          font-size: 1.5rem;
        }
      }
    </style>
  </main>

  <!-- Modal potvrzení hlasu -->
  <div id="voteModal" class="modal hidden">
    <div class="modal-content">
      <h2 id="modalText"></h2>
      <div class="modal-buttons">
        <button id="confirmVote" type="button">✅ Potvrdit</button>
        <button id="cancelVote" type="button">❌ Zrušit</button>
      </div>
    </div>
  </div>

  <!-- Video modal -->
  <div id="videoModal" class="modal hidden">
    <div class="modal-content" style="max-width: 900px;">
      <button id="closeVideo" type="button">✖ Zavřít</button>

      <div class="video-wrapper">
        <iframe
          id="videoFrame"
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
          allowfullscreen>
        </iframe>
      </div>
    </div>
  </div>

  <footer>
    <p>© 2026 ZŠ Husova Liberec</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
